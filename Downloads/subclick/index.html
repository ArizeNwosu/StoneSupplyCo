<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SubClick</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tw-animate-css@1.2.3/dist/tw-animate.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Playfair Display', 'serif']
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.553.0",
    "clsx": "https://cdn.jsdelivr.net/npm/clsx@2.1.1/+esm",
    "tailwind-merge": "https://cdn.jsdelivr.net/npm/tailwind-merge@2.4.0/+esm",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/+esm"
  }
}
</script>
<style>
  @keyframes subtle-float {
    0%, 100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-8px);
    }
  }
  .animate-subtle-float {
    animation: subtle-float 4s ease-in-out infinite;
  }
  @keyframes gradient-pan {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }
  .animate-gradient-pan {
    background-size: 200% 200%;
    animation: gradient-pan 10s ease infinite;
  }
  .shimmer-effect::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(
      110deg,
      transparent 40%,
      rgba(255, 255, 255, 0.07) 50%,
      transparent 60%
    );
    animation: shimmer-sweep 6s linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes shimmer-sweep {
    0% {
      transform: translateX(-100%);
    }
    100% {
      transform: translateX(100%);
    }
  }

  /* Sign-in page animations */
  @keyframes fadeSlideIn {
    to {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0px);
    }
  }
  .animate-element {
    opacity: 0;
    filter: blur(4px);
    transform: translateY(10px);
    animation: fadeSlideIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes slideRightIn {
    to {
      opacity: 1;
      filter: blur(0px);
      transform: translateX(0px);
    }
  }
  .animate-slide-right {
    opacity: 0;
    filter: blur(4px);
    transform: translateX(-10px);
    animation: slideRightIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes testimonialIn {
    to {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0px) scale(1);
    }
  }
  .animate-testimonial {
    opacity: 0;
    filter: blur(4px);
    transform: translateY(10px) scale(0.95);
    animation: testimonialIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  /* Custom Checkbox Style */
  .custom-checkbox {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    width: 1.25rem;
    height: 1.25rem;
    border-radius: 0.375rem;
    border: 1px solid #9ca3af; /* gray-400 */
    background-color: transparent;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
  }
  .custom-checkbox:checked {
    background-color: #8b5cf6; /* violet-500 */
    border-color: #8b5cf6;
  }
  .custom-checkbox:checked::after {
    content: '✓';
    position: absolute;
    color: white;
    font-size: 0.875rem;
    font-weight: bold;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
