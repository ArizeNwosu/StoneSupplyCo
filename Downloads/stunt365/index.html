    <title>Stunt364 | Taurus World Stunt Awards Strategy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Oswald:wght@200;300;400;500;600;700&display=swap');
      
      :root {
        --taurus-gold: #C5A059;
        --taurus-bronze: #8E6D31;
        --taurus-black: #000000;
        --taurus-dark: #0A0A0A;
      }

      body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--taurus-black);
        color: #f4f4f5;
        overflow-x: hidden;
      }
      
      .oswald, .serif-header {
        font-family: 'Oswald', sans-serif;
        text-transform: uppercase;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #C5A059;
        border-radius: 0px;
      }
      
      .taurus-gradient {
        background: linear-gradient(180deg, #EAD196 0%, #C5A059 50%, #8E6D31 100%);
      }
      
      .taurus-text-gold {
        background: linear-gradient(135deg, #EAD196 0%, #C5A059 50%, #8E6D31 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .taurus-border-gold {
        border-color: rgba(197, 160, 89, 0.3);
      }
      
      .cinematic-glow {
        box-shadow: 0 0 50px rgba(197, 160, 89, 0.08);
      }
      
      .card-bg {
        background-color: #0F0F0F;
        border: 1px solid rgba(197, 160, 89, 0.15);
      }

      .btn-taurus {
        background: linear-gradient(180deg, #EAD196 0%, #C5A059 50%, #8E6D31 100%);
        color: black;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        transition: all 0.3s ease;
      }
      .btn-taurus:hover {
        filter: brightness(1.1);
        transform: scale(1.02);
      }
    </style>
