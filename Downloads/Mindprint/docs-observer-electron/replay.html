<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keystroke Replay</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0d; --bg2: #141414; --bg3: #1c1c1c;
  --border: #252525; --text: #e0e0e0; --muted: #777; --dim: #444;
  --font: 'SF Mono', Menlo, Consolas, monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 12px; overflow: hidden; }

button { background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  font-family: var(--font); font-size: 11px; padding: 5px 12px; border-radius: 4px;
  cursor: pointer; transition: border-color .12s, color .12s; white-space: nowrap; }
button:hover { border-color: #555; color: #fff; }
button.on    { border-color: #4fc3f7; color: #4fc3f7; background: #111e27; }
button.speed { padding: 3px 7px; font-size: 10px; }

/* ── Input screen ──────────────────────────────────────────────────────────── */
#input { height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; padding: 40px; }
#input h1 { font-size: 16px; letter-spacing: .15em; }
#input p  { color: var(--muted); font-size: 11px; }
#paste { width: 100%; max-width: 680px; height: 180px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-family: var(--font); font-size: 11px; padding: 12px; resize: vertical; outline: none; }
#paste:focus { border-color: #4fc3f7; }
.row { display: flex; gap: 8px; align-items: center; }
#err { color: #ef5350; font-size: 11px; display: none; }
#file-in { display: none; }

/* ── Viewer ────────────────────────────────────────────────────────────────── */
#viewer { display: none; flex-direction: column; height: 100%; }
#viewer.on { display: flex; }

#topbar { display: flex; align-items: center; justify-content: space-between;
  padding: 7px 14px; background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; min-height: 40px; gap: 12px; }
#legend { display: flex; gap: 12px; flex-wrap: wrap; overflow: hidden; }
.leg { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
#topright { display: flex; gap: 8px; }

#split { display: grid; grid-template-columns: 1fr 300px; flex: 1; min-height: 0; overflow: hidden; }

/* document pane — hosts both text-mode div and composite canvas */
#doc-pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; position: relative; }
#doc-meta { display: flex; align-items: center; justify-content: space-between;
  padding: 5px 14px; border-bottom: 1px solid var(--border); color: var(--muted);
  font-size: 10px; flex-shrink: 0; }
#app-now  { display: flex; align-items: center; gap: 6px; }
#app-dot  { width: 7px; height: 7px; border-radius: 50%; background: #555; }

/* text mode */
#text-mode { flex: 1; overflow-y: auto; padding: 28px 32px; }
#doc-text { font-family: Georgia, serif; font-size: 16px; line-height: 1.8;
  color: #e8e8e8; white-space: pre-wrap; word-break: break-word; min-height: 1.8em; }
#cursor { display: inline-block; width: 2px; height: .9em;
  background: #4fc3f7; vertical-align: text-bottom; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* composite mode */
#composite-mode { flex: 1; display: none; align-items: center; justify-content: center;
  background: #000; overflow: hidden; }
#composite-mode.on { display: flex; }
#comp-canvas { display: block; max-width: 100%; max-height: 100%; }

/* sidebar */
#sidebar { display: flex; flex-direction: column; background: var(--bg2); overflow: hidden; }
#sb-head { padding: 5px 10px; border-bottom: 1px solid var(--border);
  color: var(--muted); font-size: 10px; letter-spacing: .08em; flex-shrink: 0; }
#sb-list { flex: 1; overflow-y: auto; padding: 2px 0; }
.ev { display: flex; align-items: center; gap: 5px; padding: 2px 8px;
  cursor: pointer; border-left: 2px solid transparent; transition: background .08s; }
.ev:hover { background: var(--bg3); }
.ev.hi    { background: #111e27; border-left-color: #4fc3f7; }
.ev-dot   { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.ev-t     { color: var(--dim); width: 50px; flex-shrink: 0; font-size: 10px; }
.ev-op    { width: 24px; flex-shrink: 0; font-size: 10px; font-weight: bold; }
.ev-op.i  { color: #66bb6a; } .ev-op.d { color: #ef5350; }
.ev-ch    { color: var(--text); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-size: 11px; }
.pause-row { text-align: center; color: var(--dim); font-size: 10px; padding: 5px; }

/* controls */
#ctrl { display: flex; align-items: center; gap: 8px; padding: 7px 14px;
  border-top: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; flex-wrap: wrap; }
#time-d { color: var(--muted); font-size: 11px; min-width: 110px; }
#ev-cnt { color: var(--dim); font-size: 10px; margin-left: auto; }

/* timeline */
#tl-wrap { padding: 8px 14px 14px; flex-shrink: 0; }
#tl { width: 100%; height: 52px; display: block; cursor: crosshair; border-radius: 3px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
</style>
</head>
<body>

<!-- ── Input ──────────────────────────────────────────────────────────────── -->
<div id="input">
  <h1>KEYSTROKE REPLAY</h1>
  <p>Paste a JSON event log (one object per line or JSON array) — or load from file</p>
  <textarea id="paste" spellcheck="false"
    placeholder='{"app":"TextEdit","text":"h","ts":"2026-03-11T08:10:26.348Z","type":"insert"}'></textarea>
  <div class="row">
    <button onclick="fromPaste()">Load Events</button>
    <button onclick="document.getElementById('file-in').click()">Load JSON File</button>
    <button onclick="demo()">Try Demo</button>
    <input id="file-in" type="file" accept=".json" onchange="fromFile(event)">
  </div>
  <div id="err"></div>
</div>

<!-- ── Viewer ─────────────────────────────────────────────────────────────── -->
<div id="viewer">
  <div id="topbar">
    <div id="legend"></div>
    <div id="topright">
      <!-- only shown when at least one scene has been captured -->
      <button id="btn-view" onclick="toggleViewMode()" style="display:none">⬜ Composite</button>
      <button onclick="unload()">← New log</button>
    </div>
  </div>

  <div id="split">
    <div id="doc-pane">
      <div id="doc-meta">
        <div id="app-now"><div id="app-dot"></div><span id="app-name">—</span></div>
        <span id="doc-lbl"></span>
      </div>

      <!-- Text mode -->
      <div id="text-mode">
        <div id="doc-text"><span id="cursor"></span></div>
      </div>

      <!-- Composite mode -->
      <div id="composite-mode">
        <canvas id="comp-canvas"></canvas>
      </div>
    </div>

    <div id="sidebar">
      <div id="sb-head">EVENT LOG</div>
      <div id="sb-list"></div>
    </div>
  </div>

  <div id="ctrl">
    <button id="btn-play" onclick="togglePlay()">▶ Play</button>
    <button onclick="reset()">↺ Reset</button>
    <span style="color:var(--dim);font-size:10px;margin-left:4px">SPEED</span>
    <button class="speed on" data-s="1"  onclick="setSpeed(1)">1×</button>
    <button class="speed"    data-s="2"  onclick="setSpeed(2)">2×</button>
    <button class="speed"    data-s="5"  onclick="setSpeed(5)">5×</button>
    <button class="speed"    data-s="10" onclick="setSpeed(10)">10×</button>
    <span id="time-d">0:00.0 / 0:00.0</span>
    <span id="ev-cnt">Event 0 / 0</span>
  </div>

  <div id="tl-wrap"><canvas id="tl"></canvas></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const PALETTE = ['#4fc3f7','#aed581','#ffb74d','#f48fb1','#ce93d8','#80cbc4','#ff8a65','#fff176','#90caf9','#a5d6a7']
const PAUSE_MS  = 3000
const PAUSE_CAP = 1800

let evs = [], vt = [], colors = {}, ci = 0
let idx = -1, playing = false, speed = 1, timer = null
let compositeMode = false
const imgCache = new Map()   // base64 → HTMLImageElement

// ═══════════════════════════════════════════════════════════════════════════
// PARSE & ENRICH
// ═══════════════════════════════════════════════════════════════════════════
function parseRaw(raw) {
  const out = []
  try { const a = JSON.parse(raw.trim()); if (Array.isArray(a)) { a.forEach(o => valid(o) && out.push(o)); if (out.length) return out } } catch(_) {}
  for (const line of raw.split('\n')) { const t = line.trim(); if (!t) continue; try { const o = JSON.parse(t); if (valid(o)) out.push(o) } catch(_) {} }
  return out
}
const valid = o => o && typeof o.ts === 'string' && typeof o.type === 'string' &&
                   (o.text !== undefined || o.type === 'scene')

function enrich(raw) {
  raw.sort((a,b) => +new Date(a.ts) - +new Date(b.ts))

  // Fold standalone type:'scene' events (emitted async by watcher) into the
  // most-recent preceding keystroke with the same app, then remove them.
  const cleaned = []
  for (const e of raw) {
    if (e.type === 'scene') {
      for (let j = cleaned.length - 1; j >= 0; j--) {
        if (cleaned[j].app === e.app) { cleaned[j].scene = e.scene; break }
      }
      continue
    }
    cleaned.push(e)
  }
  raw = cleaned

  const t0 = +new Date(raw[0].ts)
  let curScene = null
  raw.forEach(e => {
    e.relMs = +new Date(e.ts) - t0
    if (e.scene) curScene = e.scene
    e._scene = curScene        // each event carries a ref to its current scene
    if (!colors[e.app]) colors[e.app] = PALETTE[ci++ % PALETTE.length]
  })
  raw.forEach((e,i) => {
    e.gap       = i === 0 ? 0 : e.relMs - raw[i-1].relMs
    e.pause     = e.gap > PAUSE_MS
    e.appSwitch = i === 0 || e.app !== raw[i-1].app
  })
  const v = [0]
  for (let i = 1; i < raw.length; i++) v.push(v[i-1] + (raw[i].pause ? Math.min(raw[i].gap, PAUSE_CAP) : raw[i].gap))
  return { evs: raw, vt: v }
}

// Pre-load screenshot images into cache so they're ready before rendering
function preloadImages() {
  for (const e of evs) {
    if (e.scene?.screenshot && !imgCache.has(e.scene.screenshot)) {
      const img = new Image()
      img.src = e.scene.screenshot
      imgCache.set(e.scene.screenshot, img)
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// DOCUMENT TEXT RECONSTRUCTION
// ═══════════════════════════════════════════════════════════════════════════
function buildText(upto) {
  let s = ''
  for (let i = 0; i <= upto; i++) {
    const { type, text: t } = evs[i]
    if (type === 'insert') { s += t === '↵' ? '\n' : t === '⇥' ? '    ' : t }
    else if (type === 'delete' && t === '⌫' && s.length > 0) { const cp = [...s]; cp.pop(); s = cp.join('') }
  }
  return s
}

// ═══════════════════════════════════════════════════════════════════════════
// COMPOSITE RENDERING
// Two layers:
//   1. Screenshot (scaled to fill pane)
//   2. White fill + reconstructed text inside textArea bounding rect
// ═══════════════════════════════════════════════════════════════════════════
const compCanvas = document.getElementById('comp-canvas')
const compCtx    = compCanvas.getContext('2d')

function renderComposite() {
  const scene = idx >= 0 ? evs[idx]._scene : null
  if (!scene) return

  const img = imgCache.get(scene.screenshot)
  if (!img || !img.complete || img.naturalWidth === 0) {
    // Image not ready yet — try again shortly
    img && img.addEventListener('load', renderComposite, { once: true })
    return
  }

  const pane   = document.getElementById('composite-mode')
  const paneW  = pane.clientWidth
  const paneH  = pane.clientHeight
  const imgAR  = img.naturalWidth / img.naturalHeight
  const paneAR = paneW / paneH

  // Fit image into pane (letterbox)
  let drawW, drawH, drawX, drawY
  if (imgAR > paneAR) { drawW = paneW; drawH = paneW / imgAR; drawX = 0; drawY = (paneH - drawH) / 2 }
  else                { drawH = paneH; drawW = paneH * imgAR; drawY = 0; drawX = (paneW - drawW) / 2 }

  compCanvas.width  = paneW
  compCanvas.height = paneH

  // ── Layer 1: screenshot background ───────────────────────────────────────
  compCtx.clearRect(0, 0, paneW, paneH)
  compCtx.drawImage(img, drawX, drawY, drawW, drawH)

  // ── Compute text-area rect in canvas coords ───────────────────────────────
  const ta = scene.textArea
  const tx = drawX + ta.x * drawW
  const ty = drawY + ta.y * drawH
  const tw = ta.w  * drawW
  const th = ta.h  * drawH

  if (tw < 10 || th < 10) return   // no meaningful text area captured

  // ── Layer 2a: clear & fill text area (white paper) ────────────────────────
  compCtx.fillStyle = '#FAFAFA'
  compCtx.fillRect(tx, ty, tw, th)

  // Subtle inner shadow to signal the replacement region
  compCtx.strokeStyle = 'rgba(0,0,0,0.12)'
  compCtx.lineWidth = 1
  compCtx.strokeRect(tx + .5, ty + .5, tw - 1, th - 1)

  // ── Layer 2b: reconstructed text ─────────────────────────────────────────
  const text     = idx >= 0 ? buildText(idx) : ''
  const padding  = Math.round(Math.min(tw, th) * 0.04) + 8
  const fontSize = Math.max(12, Math.round(th * 0.026))
  const lineH    = fontSize * 1.75
  const maxTW    = tw - padding * 2
  const maxTH    = th - padding * 2

  compCtx.font      = `${fontSize}px Georgia, serif`
  compCtx.fillStyle = '#1a1a1a'
  compCtx.textBaseline = 'top'

  // Wrap and layout text lines within the text area
  const lines = layoutText(compCtx, text, maxTW, fontSize, lineH)

  let lastX = tx + padding, lastY = ty + padding
  for (const { str, x, y } of lines) {
    const cy = ty + padding + y
    if (cy + lineH > ty + th - padding) break    // overflow guard
    compCtx.fillText(str, tx + padding + x, cy)
    lastX = tx + padding + x + compCtx.measureText(str).width
    lastY = cy
  }

  // ── Blinking cursor at end of text ────────────────────────────────────────
  const cursorColor = colors[idx >= 0 ? evs[idx].app : ''] || '#4fc3f7'
  compCtx.fillStyle = cursorColor
  compCtx.fillRect(lastX + 1, lastY, 2, fontSize)
}

// Returns array of { str, x, y } — y is relative to text area top+padding
function layoutText(ctx, text, maxW, fontSize, lineH) {
  const result = []
  let y = 0
  for (const rawLine of text.split('\n')) {
    if (rawLine === '') { y += lineH; continue }
    const words = rawLine.split(' ')
    let line = ''
    for (const word of words) {
      const test = line ? line + ' ' + word : word
      if (ctx.measureText(test).width > maxW && line) {
        result.push({ str: line, x: 0, y })
        y += lineH; line = word
      } else { line = test }
    }
    if (line) { result.push({ str: line, x: 0, y }); y += lineH }
  }
  return result
}

// ═══════════════════════════════════════════════════════════════════════════
// VIEW MODE TOGGLE
// ═══════════════════════════════════════════════════════════════════════════
function toggleViewMode() {
  compositeMode = !compositeMode
  document.getElementById('text-mode').style.display       = compositeMode ? 'none' : ''
  document.getElementById('composite-mode').classList.toggle('on', compositeMode)
  document.getElementById('btn-view').textContent          = compositeMode ? '☰ Text' : '⬜ Composite'
  document.getElementById('btn-view').classList.toggle('on', compositeMode)
  if (compositeMode) renderComposite()
}

function hasAnyScene() { return evs.some(e => e.scene) }

// ═══════════════════════════════════════════════════════════════════════════
// TIMELINE CANVAS
// ═══════════════════════════════════════════════════════════════════════════
const tlCanvas = document.getElementById('tl')
const tlCtx    = tlCanvas.getContext('2d')

function drawTL() {
  const dpr = devicePixelRatio || 1
  const W   = tlCanvas.clientWidth, H = tlCanvas.clientHeight
  tlCanvas.width = W * dpr; tlCanvas.height = H * dpr; tlCtx.scale(dpr, dpr)
  tlCtx.fillStyle = '#111'; tlCtx.fillRect(0, 0, W, H)
  if (!evs.length) return

  const total = vt[vt.length-1] || 1
  const X = v => (v / total) * W
  const TY = H * .42, TH = H * .25

  // Track segments
  for (let i = 0; i < evs.length; i++) {
    const x1 = X(vt[i]), x2 = i < evs.length-1 ? X(vt[i+1]) : W
    tlCtx.fillStyle = (i < evs.length-1 && evs[i+1].pause) ? '#222' : (colors[evs[i].app] || '#888') + '50'
    tlCtx.fillRect(x1, TY, Math.max(x2 - x1, 1), TH)
  }

  // Pause ticks
  for (let i = 1; i < evs.length; i++) {
    if (!evs[i].pause) continue
    const x = X(vt[i])
    tlCtx.fillStyle = '#3a3a3a'; tlCtx.fillRect(x-1, TY-6, 2, TH+12)
    tlCtx.fillStyle = '#555'; tlCtx.font = '9px monospace'; tlCtx.textAlign = 'center'
    tlCtx.fillText(`${(evs[i].gap/1000).toFixed(1)}s`, x, TY-10)
  }

  // App-switch diamonds
  for (let i = 1; i < evs.length; i++) {
    if (!evs[i].appSwitch) continue
    const x = X(vt[i]), c = colors[evs[i].app] || '#888', r = 4.5
    tlCtx.fillStyle = c; tlCtx.beginPath()
    tlCtx.moveTo(x, TY+TH+6); tlCtx.lineTo(x+r, TY+TH+6+r)
    tlCtx.lineTo(x, TY+TH+6+r*2); tlCtx.lineTo(x-r, TY+TH+6+r); tlCtx.closePath(); tlCtx.fill()
  }

  // Scene-capture markers (camera icon position)
  for (let i = 0; i < evs.length; i++) {
    if (!evs[i].scene) continue
    const x = X(vt[i])
    tlCtx.fillStyle = '#fff8'; tlCtx.font = '9px sans-serif'; tlCtx.textAlign = 'center'
    tlCtx.fillText('📷', x, 8)
  }

  // Playhead
  if (idx >= 0) {
    const x = X(vt[idx])
    tlCtx.fillStyle = 'rgba(255,255,255,.9)'; tlCtx.fillRect(x-1, 0, 2, H)
    tlCtx.beginPath(); tlCtx.moveTo(x-5, 0); tlCtx.lineTo(x+5, 0); tlCtx.lineTo(x, 7); tlCtx.closePath(); tlCtx.fill()
  }
}

let dragging = false
function xToIdx(cx) {
  const { left, width } = tlCanvas.getBoundingClientRect()
  const r = Math.max(0, Math.min(1, (cx - left) / width))
  const t = r * (vt[vt.length-1] || 0)
  let best = 0, bestD = Infinity
  for (let i = 0; i < vt.length; i++) { const d = Math.abs(vt[i]-t); if (d < bestD) { bestD = d; best = i } }
  return best
}
tlCanvas.addEventListener('mousedown', e => { if (!evs.length) return; dragging = true; pause_(); goTo(xToIdx(e.clientX)) })
window.addEventListener('mousemove', e => { if (dragging) goTo(xToIdx(e.clientX)) })
window.addEventListener('mouseup',   () => { dragging = false })
new ResizeObserver(drawTL).observe(tlCanvas)

// ═══════════════════════════════════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════════════════════════════════
function buildSidebar() {
  const list = document.getElementById('sb-list'); list.innerHTML = ''
  for (let i = 0; i < evs.length; i++) {
    const e = evs[i]
    if (e.pause) {
      const sep = document.createElement('div'); sep.className = 'pause-row'
      sep.textContent = `── ${(e.gap/1000).toFixed(1)}s pause ──`; list.appendChild(sep)
    }
    const row = document.createElement('div'); row.className = 'ev'; row.dataset.i = i
    row.addEventListener('click', () => { pause_(); goTo(i) })
    const d = document.createElement('div'); d.className = 'ev-dot'; d.style.background = colors[e.app] || '#888'
    const t = document.createElement('span'); t.className = 'ev-t'; t.textContent = '+' + (e.relMs/1000).toFixed(2) + 's'
    const op = document.createElement('span'); op.className = 'ev-op ' + (e.type==='insert'?'i':'d'); op.textContent = e.type==='insert'?'INS':'DEL'
    const ch = document.createElement('span'); ch.className = 'ev-ch'; ch.textContent = e.text
    // camera icon if scene captured with this event
    if (e.scene) { const cam = document.createElement('span'); cam.textContent = ' 📷'; cam.style.fontSize='9px'; ch.appendChild(cam) }
    row.append(d, t, op, ch); list.appendChild(row)
  }
}

function hlSidebar(i) {
  const list = document.getElementById('sb-list')
  for (const row of list.querySelectorAll('.ev')) {
    const active = +row.dataset.i === i
    row.classList.toggle('hi', active)
    if (active) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// UI SYNC
// ═══════════════════════════════════════════════════════════════════════════
function render() {
  const app  = idx >= 0 ? evs[idx].app : '—'
  const text = idx >= 0 ? buildText(idx) : ''

  // Text mode
  if (!compositeMode) {
    const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    document.getElementById('doc-text').innerHTML =
      esc + `<span id="cursor" style="background:${colors[app]||'#4fc3f7'}"></span>`
  } else {
    renderComposite()
  }

  document.getElementById('app-name').textContent          = app
  document.getElementById('app-dot').style.background      = colors[app] || '#555'
  document.getElementById('doc-lbl').textContent           = idx >= 0 ? `Event ${idx+1} of ${evs.length}` : `${evs.length} events — press Play`
  const curMs = idx >= 0 ? evs[idx].relMs : 0
  const totMs = evs.length ? evs[evs.length-1].relMs : 0
  document.getElementById('time-d').textContent            = fmt(curMs) + ' / ' + fmt(totMs)
  document.getElementById('ev-cnt').textContent            = `Event ${Math.max(0,idx+1)} / ${evs.length}`
  document.getElementById('btn-play').textContent          = playing ? '⏸ Pause' : '▶ Play'
  hlSidebar(idx)
  drawTL()
}

function fmt(ms) { const s=ms/1000, m=Math.floor(s/60); return `${m}:${(s%60).toFixed(1).padStart(4,'0')}` }

function buildLegend() {
  const leg = document.getElementById('legend'); leg.innerHTML = ''
  for (const [a, c] of Object.entries(colors)) {
    const item = document.createElement('div'); item.className = 'leg'
    const dot = document.createElement('div'); dot.className = 'dot'; dot.style.background = c
    const lbl = document.createElement('span'); lbl.textContent = a
    item.append(dot, lbl); leg.appendChild(item)
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PLAYBACK
// ═══════════════════════════════════════════════════════════════════════════
function goTo(i) { idx = Math.max(-1, Math.min(i, evs.length-1)); render() }

function pause_() { clearTimeout(timer); timer = null; playing = false }

function tick() {
  if (!playing || idx >= evs.length-1) { playing = false; render(); return }
  const next  = idx + 1
  const delay = Math.min(evs[next].gap, 3000) / speed
  timer = setTimeout(() => { goTo(next); tick() }, delay)
}

function togglePlay() {
  if (playing) { pause_(); render() }
  else { if (idx >= evs.length-1) goTo(-1); playing = true; tick() }
}

function reset() { pause_(); goTo(-1) }

function setSpeed(s) {
  speed = s
  document.querySelectorAll('.speed').forEach(b => b.classList.toggle('on', +b.dataset.s === s))
}

// ═══════════════════════════════════════════════════════════════════════════
// LOAD / UNLOAD
// ═══════════════════════════════════════════════════════════════════════════
function loadData(raw) {
  colors = {}; ci = 0; playing = false; compositeMode = false
  clearTimeout(timer)

  const parsed = parseRaw(typeof raw === 'string' ? raw : JSON.stringify(raw))
  if (!parsed.length) {
    document.getElementById('err').textContent = 'No valid events found.'
    document.getElementById('err').style.display = 'block'; return
  }
  document.getElementById('err').style.display = 'none'

  const r = enrich(parsed); evs = r.evs; vt = r.vt; idx = -1
  preloadImages()

  // Show composite toggle only if scenes were captured
  document.getElementById('btn-view').style.display = hasAnyScene() ? '' : 'none'
  // Default to composite mode if scenes available
  if (hasAnyScene()) {
    compositeMode = true
    document.getElementById('text-mode').style.display = 'none'
    document.getElementById('composite-mode').classList.add('on')
    document.getElementById('btn-view').textContent = '☰ Text'
    document.getElementById('btn-view').classList.add('on')
  }

  buildSidebar(); buildLegend(); render()
  document.getElementById('input').style.display = 'none'
  document.getElementById('viewer').classList.add('on')
}

function unload() {
  pause_(); evs = []; vt = []; colors = {}; ci = 0; idx = -1; compositeMode = false
  imgCache.clear()
  document.getElementById('viewer').classList.remove('on')
  document.getElementById('input').style.display = ''
  document.getElementById('paste').value = ''
  document.getElementById('text-mode').style.display = ''
  document.getElementById('composite-mode').classList.remove('on')
}

function fromPaste() {
  const v = document.getElementById('paste').value.trim()
  if (!v) { document.getElementById('err').textContent = 'Paste your event log first.'; document.getElementById('err').style.display='block'; return }
  loadData(v)
}

function fromFile(ev) {
  const f = ev.target.files[0]; if (!f) return
  new FileReader().onload = e => loadData(e.target.result); ev.target.files[0] && new FileReader().readAsText(f)
}

// Fix fromFile — new FileReader must call readAsText
function fromFile(ev) {
  const f = ev.target.files[0]; if (!f) return
  const r = new FileReader(); r.onload = e => loadData(e.target.result); r.readAsText(f)
}

function demo() {
  const t = Date.now()
  const mk = (app, text, type, ms) => ({ app, text, type, ts: new Date(t+ms).toISOString() })
  loadData(JSON.stringify([
    mk('TextEdit','H','insert',0),    mk('TextEdit','e','insert',130),
    mk('TextEdit','l','insert',250),  mk('TextEdit','l','insert',360),
    mk('TextEdit','o','insert',475),  mk('TextEdit','⌫','delete',700),
    mk('TextEdit','⌫','delete',820), mk('TextEdit','l','insert',980),
    mk('TextEdit','o','insert',1090), mk('TextEdit','!','insert',1200),
    mk('TextEdit','↵','insert',1400),
    mk('Google Chrome','t','insert',5800), mk('Google Chrome','h','insert',5920),
    mk('Google Chrome','i','insert',6040), mk('Google Chrome','s','insert',6160),
    mk('Google Chrome',' ','insert',6300), mk('Google Chrome','w','insert',6420),
    mk('Google Chrome','o','insert',6540), mk('Google Chrome','r','insert',6660),
    mk('Google Chrome','k','insert',6780), mk('Google Chrome','s','insert',6900),
  ]))
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!evs.length || e.target.tagName === 'TEXTAREA') return
  if (e.key === ' ')          { e.preventDefault(); togglePlay() }
  if (e.key === 'ArrowRight') { pause_(); goTo(idx+1) }
  if (e.key === 'ArrowLeft')  { pause_(); goTo(idx-1) }
  if (e.key === 'Home')       { pause_(); goTo(-1) }
  if (e.key === 'End')        { pause_(); goTo(evs.length-1) }
})

// ── Electron bridge: receive data injected by main.js ────────────────────
if (window.bridge) {
  window.bridge.onData(raw => loadData(raw))
}

// Also handle ResizeObserver on composite pane to re-render when pane resizes
new ResizeObserver(() => { if (compositeMode) renderComposite() })
  .observe(document.getElementById('composite-mode'))
</script>
